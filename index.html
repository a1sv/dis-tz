<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger UI - DIS-TZ API</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui.css" />
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            background: #fafafa;
        }
        .topbar {
            background-color: #1b1b1b;
            padding: 10px 0;
        }
        .topbar-wrapper {
            max-width: 1460px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
        }
        .topbar-wrapper a {
            text-decoration: none;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .topbar-wrapper a span {
            color: #85ea2d;
        }
        .swagger-ui .info .title small.version-stamp {
            background-color: #89bf04;
        }
        .github-corner {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 1000;
        }
        @media (max-width: 768px) {
            .github-corner svg {
                width: 50px;
                height: 50px;
            }
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
            z-index: 10000;
            max-width: 80%;
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-wrapper">
        <a href="#" class="logo">
            📄 <span>DIS-TZ</span> API Documentation
        </a>
    </div>
</div>

<div id="swagger-ui">
    <div class="loading">Загрузка Swagger UI...</div>
</div>

<!-- GitHub Corner -->
<a href="https://github.com/a1sv/dis-tz" class="github-corner" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub">
    <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
        <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
        <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
        <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
    </svg>
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-standalone-preset.js"></script>
<script>
    // Функция для отображения ошибки
    function showError(message, details) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';
        errorDiv.innerHTML = `
            <h3>⚠️ Ошибка загрузки Swagger спецификации</h3>
            <p>${message}</p>
            <p><strong>${details}</strong></p>
            <hr>
            <p><small>Убедитесь, что файл <code>swagger.yaml</code> существует в корне репозитория</small></p>
            <button onclick="location.reload()" style="
                margin-top: 15px;
                padding: 8px 20px;
                background: #1b1b1b;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
            ">Обновить страницу</button>
        `;
        document.body.appendChild(errorDiv);

        // Убираем индикатор загрузки
        const loadingDiv = document.querySelector('#swagger-ui .loading');
        if (loadingDiv) {
            loadingDiv.style.display = 'none';
        }
    }

    // Ждем полной загрузки всех скриптов
    window.addEventListener('load', function() {
        // Проверяем, что SwaggerUI загрузился
        if (typeof SwaggerUIBundle === 'undefined') {
            showError('Swagger UI библиотека не загрузилась', 'Проверьте подключение к интернету или CDN');
            return;
        }

        // Пробуем разные варианты URL для swagger.yaml
        const possibleUrls = [
            window.location.origin + '/dis-tz/swagger.yaml',
            window.location.origin + '/swagger.yaml',
            'https://raw.githubusercontent.com/a1sv/dis-tz/main/swagger.yaml',
            './swagger.yaml'
        ];

        let currentUrlIndex = 0;

        function tryLoadSwagger() {
            const swaggerYamlUrl = possibleUrls[currentUrlIndex];
            console.log(`Попытка ${currentUrlIndex + 1}: загрузка из ${swaggerYamlUrl}`);

            // Сначала проверяем, существует ли файл
            fetch(swaggerYamlUrl, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        console.log('Файл найден! Загружаем Swagger UI');
                        initializeSwagger(swaggerYamlUrl);
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                })
                .catch(error => {
                    console.warn(`Не удалось загрузить из ${swaggerYamlUrl}:`, error);
                    currentUrlIndex++;
                    if (currentUrlIndex < possibleUrls.length) {
                        tryLoadSwagger();
                    } else {
                        showError(
                            'Swagger спецификация не найдена',
                            'Проверено несколько возможных путей. Убедитесь, что файл swagger.yaml существует в корне репозитория.'
                        );
                    }
                });
        }

        function initializeSwagger(url) {
            const ui = SwaggerUIBundle({
                url: url,
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "BaseLayout",
                docExpansion: "list",
                defaultModelExpandDepth: 1,
                defaultModelsExpandDepth: 1,
                displayRequestDuration: true,
                filter: true,
                tryItOutEnabled: true,
                showExtensions: true,
                showCommonExtensions: true,
                supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch', 'options', 'head'],
                validatorUrl: "https://validator.swagger.io/validator",
                persistAuthorization: true,
                requestInterceptor: (request) => {
                    console.log('Request:', request);
                    return request;
                },
                responseInterceptor: (response) => {
                    console.log('Response:', response);
                    return response;
                },
                onComplete: function() {
                    console.log('Swagger UI успешно загружен');
                    // Убираем индикатор загрузки
                    const loadingDiv = document.querySelector('#swagger-ui .loading');
                    if (loadingDiv) {
                        loadingDiv.style.display = 'none';
                    }
                },
                onFailure: function(error) {
                    console.error('Ошибка инициализации Swagger UI:', error);
                    showError('Ошибка при загрузке спецификации', error.toString());
                }
            });

            window.ui = ui;
        }

        // Начинаем попытки загрузки
        tryLoadSwagger();
    });
</script>
</body>
</html>
